[package]
name = "fakemodelproxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A local multi-provider LLM gateway with OpenAI and Anthropic APIs, CLI, and MCP management"
license = "MIT"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "anthropic", "mcp"]
categories = ["web-programming::http-server", "command-line-utilities"]
default-run = "fakemodelproxy"
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE",
    "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md", "/AGENTS.md", "/rust-toolchain.toml",
    "/src/**/*.rs", "/src/**/*.txt", "/presets/*.json",
    "/web/*.html", "/web/*.css", "/web/*.js", "/web/*.cjs",
    "/tests/*.rs", "/scripts/*.py", "/examples/*.rs",
    "/packaging/**/*.py", "/packaging/**/*.cmd", "/packaging/**/*.txt", "/packaging/**/*.md",
    "/docs/**/*.md", "/docs/generated/*.json",
]

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
cbc = "0.1"
futures-util = "0.3.34"
hmac = "0.12"
md5 = "0.8.1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "stream", "rustls", "http2"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
schemars = "1"
jsonschema = { version = "0.37", default-features = false }
sha2 = "0.11"
tempfile = "3"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-tungstenite = "0.28"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
